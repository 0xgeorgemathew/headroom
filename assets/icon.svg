<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Headroom: an H built from two level meters. Lit cells are what you've used,
       the crossbar is where you are now, and the dim cells above it are your headroom. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2E313B"/><stop offset="1" stop-color="#0E0F13"/></linearGradient>
    <filter id="glow" x="-60%" y="-200%" width="220%" height="500%"><feGaussianBlur stdDeviation="1.8"/></filter>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <rect x=".5" y=".5" width="63" height="63" rx="14.5" fill="none" stroke="#FFFFFF" stroke-opacity=".12"/>
  <g id="lit">
    <rect x="16" y="45.6" width="10" height="6.2" rx="2.6" fill="#4A8EFF"/><rect x="38" y="45.6" width="10" height="6.2" rx="2.6" fill="#4A8EFF"/>
    <rect x="16" y="36.9" width="10" height="6.2" rx="2.6" fill="#7DB4FF"/><rect x="38" y="36.9" width="10" height="6.2" rx="2.6" fill="#7DB4FF"/>
    <rect x="16" y="28.2" width="10" height="6.2" rx="2.6" fill="#ECEDF1"/><rect x="38" y="28.2" width="10" height="6.2" rx="2.6" fill="#ECEDF1"/>
  </g>
  <use href="#lit" filter="url(#glow)" opacity=".55"/>
  <rect x="24" y="28.8" width="16" height="5" rx="2.2" fill="#ECEDF1"/>
  <rect x="16" y="19.5" width="10" height="6.2" rx="2.6" fill="#FFC248" opacity=".27"/><rect x="38" y="19.5" width="10" height="6.2" rx="2.6" fill="#FFC248" opacity=".27"/>
  <rect x="16" y="10.8" width="10" height="6.2" rx="2.6" fill="#FF6982" opacity=".27"/><rect x="38" y="10.8" width="10" height="6.2" rx="2.6" fill="#FF6982" opacity=".27"/>
</svg>
